name: Refresh profile statistics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution data and render cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f query="$(cat scripts/profile.graphql)" -f login="$PROFILE_LOGIN" > "$RUNNER_TEMP/profile.json"
          python3 scripts/render_profile.py "$RUNNER_TEMP/profile.json"
      - name: Save updated cards
        run: |
          git add assets/github-stats.svg assets/github-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile statistics"
          git push
